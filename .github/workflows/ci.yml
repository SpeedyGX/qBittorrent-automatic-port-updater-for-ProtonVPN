name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install pylint ruff

      # Explicit rule selection: ruff's own defaults change between releases and
      # the project keeps its established style (percent formatting, ...).
      - name: Ruff
        run: ruff check --select E4,E7,E9,F protonport.py tests

      # Errors only: the project intentionally keeps its own (older) formatting
      # style; real errors (undefined names, bad imports, ...) must fail the CI.
      - name: Pylint (errors only)
        run: pylint protonport.py tests --errors-only

      - name: Unit tests
        run: python -m unittest discover -s tests -v
